name: Образ TIMELINE для VPS
on:
  push:
    branches: [main]
    paths: [Dockerfile, '.dockerignore', 'package*.json', 'src/**', 'server/**', 'public/**', 'index.html', 'vite*.ts', 'tsconfig*.json', 'deploy/vps/**', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timeline-image-main
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/messagetomedium/timeline:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/messagetomedium/TIMELINE
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest for the owner
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo 'Готовый образ (amd64), сборка на VPS не нужна:' >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/messagetomedium/timeline@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Исходный commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
